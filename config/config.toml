# Mescle estas chaves com $CODEX_HOME/config.toml (~/.codex/config.toml).
# Chaves de topo precisam ficar antes da primeira tabela [..].
# medium entrega bem no dia a dia; high/xhigh deixam o Codex lento e caro.
model_reasoning_effort = "medium"
# O LLM Gateway só aceita o tier "default"; "fast" e "auto" são recusados.
service_tier = "default"

[agents]
max_concurrent_threads_per_session = 4

[features]
hooks = true
